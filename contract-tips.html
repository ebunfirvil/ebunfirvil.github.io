       md의 "### 제목 | 별칭" 소제목이 키워드 목적지 — 모든 탭 본문에서 그 단어를 누르면 해당 탭·소제목으로 이동한다.
       marked/DOMPurify는 qna.html과 같은 고정 버전 + 무결성 해시. 저장소 md를 innerHTML에 넣기 전에 반드시 DOMPurify로 살균한다. -->

  <style>
    :root {
      --orange: #e8622e;
      --orange-light: #f08850;

    body {
      font-family: 'Noto Sans KR', sans-serif;

    /* ===== TOP BAR ===== */
    .top-bar {

    .top-bar-left { display: flex; align-items: center; gap: 15px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--white); text-decoration: none; font-size: 0.9rem; font-weight: 500;
      padding: 6px 14px; border-radius: 6px; background: rgba(255,255,255,0.15);
      transition: all 0.3s ease;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }
    .top-bar-title { color: var(--white); font-size: 1rem; font-weight: 700; }

    /* ===== PAGE HEADER ===== */
    .page-header {
      background: linear-gradient(135deg, var(--navy-dark), var(--navy), var(--navy-light));
      padding: 40px 20px 32px; text-align: center; position: relative; overflow: hidden;
    }
    .page-header::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .page-header h1 {

    /* ===== TABS ===== */
    .tab-bar-wrap {

      flex: 1 0 auto; border: none; background: none; cursor: pointer;

    /* ===== 키워드 버튼 (md의 "### 제목 | 별칭"으로 자동 생성) ===== */

      }

  <script>
    const TABS = {
      process:   { file: 'contract-tips-process.md',   label: '계약 절차' },
      documents: { file: 'contract-tips-documents.md', label: '지참물과 준비 서류' },
      funding:   { file: 'contract-tips-funding.md',   label: '자금조달계획서 작성 요령' }
    };
    const TAB_ORDER = Object.keys(TABS);
    const REPO_OWNER = 'ebunfirvil';
    const REPO_NAME = 'ebunfirvil.github.io';
    const BRANCH = 'main';

    const panels = {};
    document.querySelectorAll('.tab-panel').forEach(p => {
      panels[p.dataset.tab] = { el: p, toc: p.querySelector('.toc'), card: p.querySelector('.md-card') };
    });
    const tabBtns = [...document.querySelectorAll('.tab-btn')];

    function b64DecodeUnicode(b64) {
      const binary = atob(b64.replace(/\n/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    // 1순위: 같은 사이트의 정적 파일(캐시 우회용 쿼리). 2순위: GitHub API(정적 파일이 CDN에 늦게 반영될 때).
    async function fetchMd(file) {
      try {
        const res = await fetch(file + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.text();
      } catch (err) { /* 아래 폴백 */ }
      const res = await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${file}?ref=${BRANCH}&t=${Date.now()}`,
        { headers: { 'Accept': 'application/vnd.github+json' } }
      );
      if (!res.ok) throw new Error('GitHub API ' + res.status);
      return b64DecodeUnicode((await res.json()).content);
    }

    // 저장소의 md를 그대로 innerHTML에 넣으면 저장 XSS가 되므로 반드시 살균한다(qna.html과 같은 규칙).
    function renderMarkdown(tab, md) {
      const { card, toc } = panels[tab];
      if (!window.DOMPurify || !window.marked) {
        card.textContent = '보안 모듈을 불러오지 못해 내용을 표시할 수 없습니다. 새로고침해 주세요.';
        return;
      }
      card.innerHTML = DOMPurify.sanitize(marked.parse(md));
      // 모바일 카드형 표시용: 각 칸에 머리글 이름을 붙인다
      card.querySelectorAll('table').forEach(t => {
        const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
        t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => {
          if (heads[i]) td.setAttribute('data-label', heads[i]);
        }));
      });
      // 목차: h2마다 id를 붙이고 알약 링크를 만든다(텍스트는 textContent로만 다룬다)
      toc.textContent = '';
      card.querySelectorAll('h2').forEach((h, i) => {
        h.id = tab + '-sec-' + (i + 1);
        const a = document.createElement('a');
        a.href = '#' + tab + '/' + h.id;
        const icon = document.createElement('i');
        icon.className = 'fas fa-bookmark';
        a.appendChild(icon);
        a.appendChild(document.createTextNode(h.textContent.trim()));
        toc.appendChild(a);
      });
    }

    // ── 키워드 → 해당 소제목으로 이동 ─────────────────────────────────────
    // md의 "### 제목 | 별칭 | 별칭" h3가 목적지. 제목이 키워드, 별칭도 키워드. 모든 탭의 문단·목록 항목·표 칸에서
    // (그 소제목 자신의 절 안은 제외) 목적지 하나당 첫 번째로 나오는 키워드를 버튼으로 감싼다.
    const targets = []; // {tab, id, name, aliases, heading}

    function collectTargets() {
      targets.length = 0;
      TAB_ORDER.forEach(tab => {
        let n = 0;
        panels[tab].card.querySelectorAll('h3').forEach(h => {
          const raw = h.textContent;
          if (raw.indexOf('|') < 0) return;
          const parts = raw.split('|').map(s => s.trim()).filter(Boolean);
          const t = { tab, id: tab + '-kw-' + (++n), name: parts[0], aliases: parts.slice(1), heading: h };
          h.id = t.id;
          h.textContent = t.name;
          if (t.aliases.length) {
            const al = document.createElement('span');
            al.className = 'alias';
            al.textContent = '(' + t.aliases.join(', ') + ')';
            h.appendChild(al);
          }
          // 이 소제목의 절(다음 h2/h3 전까지)에 표식을 남겨 자기 절 안에서는 링크하지 않는다
          const ti = targets.length;
          for (let n = h.nextElementSibling; n && !/^H[23]$/.test(n.tagName); n = n.nextElementSibling) {
            n.dataset.section = ti;
          }
          targets.push(t);
        });
      });
    }

    function textNodesOf(block) {
      const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
        acceptNode: t => (t.parentNode.closest('a, code, .term') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT)
      });
      const texts = [];
      for (let t = walker.nextNode(); t; t = walker.nextNode()) texts.push(t);
      return texts;
    }

    function linkKeywords() {
      if (!targets.length) return;
      // 긴 키워드부터 맞춰야 "원천징수영수증" 안의 "원천징수"가 먼저 잡히지 않는다
      const keys = [];
      targets.forEach((t, ti) => [t.name, ...t.aliases].forEach(k => keys.push({ k, ti })));
      keys.sort((a, b) => b.k.length - a.k.length);

      TAB_ORDER.forEach(tab => {
        const blocks = [...panels[tab].card.querySelectorAll('p, li, td, th, blockquote')]
          .filter(b => !(b.tagName === 'P' && b.parentNode.closest('li, blockquote')));
        blocks.forEach(block => {
          const own = block.closest('[data-section]');
          const ownIdx = own ? Number(own.dataset.section) : -1;
          const linked = new Set();
          for (const { k, ti } of keys) {
            if (ti === ownIdx || linked.has(ti)) continue;
            for (const tnode of textNodesOf(block)) {
              const idx = tnode.nodeValue.indexOf(k);
              if (idx < 0) continue;
              const hit = tnode.splitText(idx);
              hit.splitText(k.length);
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'term';
              btn.dataset.target = ti;
              btn.textContent = k;
              if (targets[ti].tab !== tab) {
                const mark = document.createElement('i');
                mark.className = 'fas fa-arrow-up-right-from-square tab-mark';
                mark.title = TABS[targets[ti].tab].label + ' 탭';
                btn.appendChild(mark);
              }
              hit.parentNode.replaceChild(btn, hit);
              linked.add(ti);
              break;
            }
          }
        });
      });
      document.getElementById('termHint').style.display = 'block';
    }

    // ── 탭 전환과 이동 ───────────────────────────────────────────────────
    let currentTab = null;
    function showTab(tab, pushHash) {
      if (!TABS[tab]) tab = TAB_ORDER[0];
      currentTab = tab;
      tabBtns.forEach(b => {
        const on = b.dataset.tab === tab;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      TAB_ORDER.forEach(t => panels[t].el.classList.toggle('active', t === tab));
      if (pushHash) history.pushState(null, '', '#' + tab);
    }

    function goTo(tab, id, pushHash) {
      showTab(tab, false);
      if (pushHash) history.pushState(null, '', '#' + tab + (id ? '/' + id : ''));
      if (!id) { window.scrollTo({ top: 0 }); return; }
      const el = document.getElementById(id);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (el.tagName === 'H3') {
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 1800);
      }
    }

    function applyHash() {
      const h = decodeURIComponent(location.hash.replace(/^#/, ''));
      const [tab, id] = h.split('/');
      if (TABS[tab]) goTo(tab, id || '', false);
      else showTab(TAB_ORDER[0], false);
    }

    tabBtns.forEach(b => b.addEventListener('click', () => {
      showTab(b.dataset.tab, true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }));
    document.querySelector('.content-wrap').addEventListener('click', e => {
      const btn = e.target.closest('button.term');
      if (btn) { const t = targets[Number(btn.dataset.target)]; if (t) goTo(t.tab, t.id, true); return; }
      const a = e.target.closest('.toc a');
      if (a) { e.preventDefault(); const [tab, id] = a.getAttribute('href').slice(1).split('/'); goTo(tab, id, true); }
    });
    window.addEventListener('popstate', applyHash);
    window.addEventListener('hashchange', applyHash);

    async function loadAll() {
      showTab(TAB_ORDER[0], false);
      const results = await Promise.all(TAB_ORDER.map(async tab => {
        try { return { tab, md: await fetchMd(TABS[tab].file) }; }
        catch (err) { return { tab, md: null }; }
      }));
      results.forEach(({ tab, md }) => {
        if (md === null) {
          panels[tab].card.innerHTML = '<p class="md-error">내용을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>';
        } else {
          renderMarkdown(tab, md);
        }
      });
      collectTargets();
      linkKeywords();
      applyHash();
    }

    loadAll();
  </script>

</body>
