<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noai, noimageai">
  <title>3D 워크스루 — e편한세상 분당 퍼스트빌리지</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #e8622e; --orange-dark: #c44e1e; --orange-light: #f0864e;
      --navy: #1a3a5c; --navy-light: #2a5a8c; --navy-dark: #0d1b2a;
      --beige: #fdf8f5; --beige-dark: #f5efe8; --beige-warm: #f0e6d8;
      --dark: #2c1810; --gray: #6b5b52; --white: #ffffff;
      --green: #4caf7d; --green-dark: #2f8a5c; --red: #c0392b; --gold: #b8860b;
      --shadow: 0 4px 20px rgba(26,58,92,0.1); --shadow-lg: 0 8px 28px rgba(26,58,92,0.18);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    footer { background: linear-gradient(135deg, var(--navy-dark), var(--navy)); color: rgba(255,255,255,0.7); padding: 24px 20px; text-align: center; margin-top: 32px; }
    footer p { font-size: 0.85rem; margin: 0 0 6px; }
    body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: var(--beige); color: var(--dark); }
    .top-bar { background: linear-gradient(135deg, var(--orange), var(--orange-dark)); padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
    .top-bar a { color: var(--white); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .page-header { background: linear-gradient(135deg, var(--navy-dark), var(--navy), var(--navy-light)); color: var(--white); text-align: center; padding: 28px 20px; }
    .page-header h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .page-header p { margin: 0; opacity: .78; font-size: .88rem; }
    main { max-width: 880px; margin: 0 auto; padding: 22px 16px 60px; }
    .card { background: var(--white); border-radius: 14px; box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 18px; }
    .card h3 { margin: 0 0 6px; font-size: 1.05rem; color: var(--navy); display: flex; align-items: center; gap: 8px; }
    .card .desc { font-size: 0.83rem; color: var(--gray); margin: 0 0 14px; line-height: 1.55; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row + .row { margin-top: 8px; }
    .row > * { flex: 1; min-width: 0; }
    input[type="text"], input[type="tel"] {
      width: 100%; padding: 11px 13px; border: 1.5px solid var(--beige-warm); border-radius: 8px; font-size: 0.95rem;
      font-family: inherit; background: var(--white); color: var(--dark); outline: none;
    }
    input:focus { border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(42,90,140,0.12); }
    .suffix { position: relative; }
    .suffix input { padding-right: 34px; }
    .suffix span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 0.9rem; pointer-events: none; }
    .btn { padding: 11px 20px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.92rem; font-family: inherit;
      color: var(--white); background: linear-gradient(135deg, var(--orange), var(--orange-light)); cursor: pointer; white-space: nowrap; transition: all .2s; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn.ghost { background: var(--beige-dark); color: var(--navy); }
    .btn.navy { background: linear-gradient(135deg, var(--navy), var(--navy-light)); }
    .btn.sm { padding: 7px 12px; font-size: 0.82rem; }
    .msg { margin-top: 12px; font-size: 0.86rem; line-height: 1.55; padding: 10px 12px; border-radius: 8px; display: none; }
    .msg.show { display: block; }
    .msg.err { background: #fdecea; color: var(--red); }
    .msg.ok { background: #e9f7ef; color: var(--green-dark); }
    .msg.info { background: var(--beige-dark); color: var(--gray); }
    .msg a { color: inherit; font-weight: 700; }

    /* ---- 뷰어 ---- */
    .viewer { position: fixed; inset: 0; background: #1b1b1b; z-index: 100; display: flex; flex-direction: column; }
    .viewer .bar { background: var(--navy-dark); color: var(--white); padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .viewer .bar .who { flex: 1; min-width: 0; font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .viewer .bar .left { font-size: 0.82rem; opacity: .85; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .viewer .bar button { background: rgba(255,255,255,.12); color: var(--white); border: none; border-radius: 8px; padding: 8px 11px; cursor: pointer; font-family: inherit; font-size: 0.85rem; white-space: nowrap; }
    .viewer .bar button:hover { background: rgba(255,255,255,.22); }
    .stage { position: relative; flex: 1; min-height: 0; background: #000; }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
    .wm-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; background-repeat: repeat; }
    .stage-note { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; color: #fff; background: rgba(13,27,42,.92); font-size: 0.95rem; line-height: 1.6; }
    .stage-note .ic { font-size: 1.8rem; opacity: .85; }
    .stage-note .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .stage-note a.btn { text-decoration: none; display: inline-block; }
    .spinner { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.25); border-top-color: var(--orange-light); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .viewer .bar { gap: 6px; padding: 6px 8px; }
      .viewer .bar .who { font-size: 0.78rem; }
      .viewer .bar .left { font-size: 0.75rem; }
      .viewer .bar button { padding: 7px 8px; font-size: 0.78rem; }
      .viewer .bar button .lbl { display: none; }
    }
    @media print { body > * { display: none !important; } body::after { content: '이 자료는 인쇄할 수 없습니다.'; display: block; padding: 40px; font-size: 18px; } }
  </style>
  <meta name="tdm-reservation" content="1">
</head>
<body>

<div class="top-bar">
  <a href="index.html"><i class="fas fa-arrow-left"></i> 메인 페이지</a>
</div>

<div class="page-header">
  <h1><i class="fas fa-cube"></i> 3D 워크스루</h1>
  <p>청약 인증을 마친 정회원 전용입니다. 화면에는 열람자 정보가 표시됩니다.</p>
</div>

<main id="authView">
  <section class="card" id="authCard">
    <h3><i class="fas fa-user-check"></i> 본인 확인</h3>
    <p class="desc">당첨동/호수와, <b>위임장을 낼 때 적은 휴대폰번호</b>를 입력해 주세요. 이 페이지는 <b>정회원 전용</b>입니다(<a href="delegate-member-guide.html">정회원 안내</a>).</p>
    <div class="row">
      <div class="suffix"><input type="text" id="building" placeholder="103" inputmode="numeric" autocomplete="off"><span>동</span></div>
      <div class="suffix"><input type="text" id="unitNo" placeholder="501" inputmode="numeric" autocomplete="off"><span>호</span></div>
    </div>
    <div class="row">
      <input type="tel" id="phone" placeholder="휴대폰번호 (예: 010-1234-5678)" inputmode="numeric" autocomplete="off" maxlength="20">
    </div>
    <div class="row">
      <button type="button" class="btn" id="authBtn"><i class="fas fa-magnifying-glass"></i> 확인</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </section>
</main>

<div class="viewer" id="viewer" hidden>
  <div class="bar">
    <div class="who" id="viewerWho"></div>
    <div class="left" id="viewerLeft"></div>
    <button type="button" id="fsBtn" title="전체 화면"><i class="fas fa-expand"></i> <span class="lbl">전체 화면</span></button>
    <button type="button" id="exitBtn" title="나가기"><i class="fas fa-right-from-bracket"></i> <span class="lbl">나가기</span></button>
  </div>
  <div class="stage" id="stage">
    <iframe id="walkFrame" title="3D 워크스루" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen"></iframe>
    <div class="wm-layer" id="wmLayer"></div>
    <div class="stage-note" id="stageNote" hidden></div>
  </div>
</div>

<footer>
  <p>e편한세상 분당 퍼스트빌리지 입주예정자협의회</p>
  <p>&copy; 2026 e편한세상 분당 퍼스트빌리지 입주예정자협의회. All rights reserved.</p>
  <p style="font-size:0.75em;opacity:0.7;margin-top:4px;">이 사이트의 글·이미지·코드를 허락 없이 복제·배포하거나 AI 학습·데이터 수집에 이용하는 것을 금합니다.</p>
</footer>

<script>
(function () {
  'use strict';
  // documents.html과 같은 Apps Script 배포. 인증은 docWalkAuth, 본문은 docWalk.
  var API_URL = 'https://script.google.com/macros/s/AKfycbxBJLSgegfKeO5DvLFMSJ01IBy1Kt4ayFZZ4uu_4bNUyrcbXS5RnbcrKJsm7EPc2pCSNw/exec';
  function $(id) { return document.getElementById(id); }

  // 토큰과 열람자 정보는 메모리 변수에만 둔다(새로고침하면 다시 본인 확인).
  var session = null; // {token, display:{name, unit}, expiresAt}
  var timer = null;
  var walkSeq = 0;    // 늦게 도착한 응답을 버리기 위한 요청 번호

  var authBtn = $('authBtn'), authMsg = $('authMsg');

  function api(payload) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (res) { return res.json(); });
  }
  // 서버에서 온 글자는 textContent로만 넣는다. 링크가 필요한 안내는 노드로 조립한다.
  function showMsg(text, kind, link) {
    authMsg.className = 'msg' + (text ? ' show ' + kind : '');
    authMsg.textContent = text || '';
    if (link) {
      authMsg.appendChild(document.createElement('br'));
      authMsg.appendChild(document.createTextNode(link.before));
      var a = document.createElement('a'); a.href = link.href; a.textContent = link.label;
      authMsg.appendChild(a);
      authMsg.appendChild(document.createTextNode(link.after));
    }
  }
  function fmtNow() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtLeft(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return '남은 시간 ' + m + ':' + String(s).padStart(2, '0');
  }

  authBtn.addEventListener('click', doAuth);
  ['building', 'unitNo', 'phone'].forEach(function (id) {
    $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') doAuth(); });
  });
  $('exitBtn').addEventListener('click', function () { backToAuth(''); });
  $('fsBtn').addEventListener('click', toggleFullscreen);

  var authBusy = false; // 요청 진행 중 표시: Enter 연타로 요청이 두 번 나가 실패 횟수가 깎이는 것을 막는다
  function doAuth() {
    if (authBusy) return;
    var building = $('building').value.trim(), unit_no = $('unitNo').value.trim(), phone = $('phone').value.trim();
    if (!building || !unit_no || !phone) { showMsg('동, 호수, 휴대폰번호를 모두 입력해 주세요.', 'err'); return; }
    authBusy = true; authBtn.disabled = true; showMsg('확인 중…', 'info');
    // 휴대폰번호는 요청 본문에만 싣고 별도 변수에 남기지 않는다.
    api({ action: 'docWalkAuth', building: building, unit_no: unit_no, phone: phone })
      .then(function (r) {
        if (r.ok) {
          $('phone').value = ''; $('building').value = ''; $('unitNo').value = '';
          showMsg('', '');
          startViewer(r);
        } else if (r.error === 'MISSING_FIELDS') {
          showMsg('동, 호수, 휴대폰번호를 모두 입력해 주세요.', 'err');
        } else if (r.error === 'BAD_PHONE') {
          showMsg('휴대폰번호를 다시 확인해 주세요.', 'err');
        } else if (r.error === 'LOCKED' || r.error === 'RATE_LIMITED') {
          showMsg('여러 번 틀려 잠겼습니다. ' + (r.retry_after_sec ? Math.ceil(r.retry_after_sec / 60) : 30) + '분 후 다시 시도해 주세요.', 'err');
        } else if (r.error === 'BUSY') {
          showMsg('지금 접속이 많습니다. 잠시 후 다시 시도해 주세요.', 'err');
        } else if (r.error === 'UNKNOWN_ACTION') {
          showMsg('아직 준비 중입니다. 준비가 끝나면 이 페이지에서 볼 수 있습니다.', 'info');
        } else if (r.error === 'NOT_VERIFIED') {
          showMsg('동·호수 또는 휴대폰번호가 맞지 않습니다' + (r.remaining ? ' (남은 시도 ' + r.remaining + '회)' : '') + '. 위임장을 낼 때 적은 휴대폰번호여야 합니다.', 'err',
            { before: '정회원 전용 페이지입니다. ', href: 'delegate-member-guide.html', label: '정회원 안내', after: '를 확인해 주세요.' });
        } else {
          showMsg('확인에 실패했습니다. 잠시 후 다시 시도해 주세요.', 'err');
        }
      })
      .catch(function () { showMsg('서버에 연결하지 못했습니다. 네트워크를 확인한 뒤 다시 시도해 주세요.', 'err'); })
      .then(function () { authBusy = false; authBtn.disabled = false; });
  }

  // ---------------- 뷰어 ----------------
  function startViewer(r) {
    var disp = r.display || {};
    var secs = Math.max(1, parseInt(r.expires_in, 10) || 0);
    session = { token: r.token, display: disp, expiresAt: Date.now() + secs * 1000 };
    $('viewerWho').textContent = (disp.name || '이름 미등록') + ' · ' + (disp.unit || '');
    setWatermark((disp.name || '') + ' · ' + (disp.unit || '') + ' · ' + fmtNow());
    $('authView').hidden = true; $('viewer').hidden = false; document.body.style.overflow = 'hidden';
    tick();
    timer = setInterval(tick, 1000);
    loadWalk();
  }

  function tick() {
    if (!session) return;
    var left = Math.ceil((session.expiresAt - Date.now()) / 1000);
    if (left <= 0) { backToAuth('열람 시간이 지나 다시 본인 확인이 필요합니다.'); return; }
    $('viewerLeft').textContent = fmtLeft(left);
  }

  function setWatermark(text) {
    var esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/'/g, '&#39;');
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='360' height='220'><text x='180' y='120' fill='rgba(255,255,255,0.22)' stroke='rgba(0,0,0,0.22)' stroke-width='0.6' font-family='sans-serif' font-size='15' text-anchor='middle' transform='rotate(-25 180 120)'>" + esc + '</text></svg>';
    $('wmLayer').style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
  }

  function showNote(icon, text, buttons) {
    var note = $('stageNote');
    note.textContent = '';
    var ic = document.createElement('div'); ic.className = 'ic';
    if (icon === 'spin') { var sp = document.createElement('div'); sp.className = 'spinner'; ic.appendChild(sp); }
    else { var i = document.createElement('i'); i.className = 'fas ' + icon; ic.appendChild(i); }
    note.appendChild(ic);
    var p = document.createElement('div'); p.textContent = text; note.appendChild(p);
    if (buttons && buttons.length) {
      var box = document.createElement('div'); box.className = 'actions';
      buttons.forEach(function (b) {
        var el;
        if (b.href) { el = document.createElement('a'); el.href = b.href; el.target = '_blank'; el.rel = 'noopener'; }
        else { el = document.createElement('button'); el.type = 'button'; el.addEventListener('click', b.fn); }
        el.className = 'btn' + (b.ghost ? ' ghost' : ''); el.textContent = b.label;
        box.appendChild(el);
      });
      note.appendChild(box);
    }
    note.hidden = false;
  }

  function loadWalk() {
    var seq = ++walkSeq, tk = session.token;
    $('walkFrame').srcdoc = '';
    showNote('spin', '3D 워크스루를 불러오는 중…');
    api({ action: 'docWalk', token: tk })
      .then(function (r) {
        if (seq !== walkSeq || !session) return;
        if (r.ok && typeof r.html === 'string') {
          $('walkFrame').srcdoc = r.html;
          $('stageNote').hidden = true;
          return;
        }
        var exit = { label: '나가기', ghost: true, fn: function () { backToAuth(''); } };
        var retry = { label: '다시 시도', fn: loadWalk };
        if (r.error === 'EXPIRED') { backToAuth('열람 시간이 지나 다시 본인 확인이 필요합니다.'); }
        else if (r.error === 'UNKNOWN_ACTION' || r.error === 'NOT_READY') { showNote('fa-hourglass-half', '아직 준비 중입니다. 준비가 끝나면 이 페이지에서 볼 수 있습니다.', [exit]); }
        else if (r.error === 'FORBIDDEN') {
          showNote('fa-lock', (r.min_grade ? String(r.min_grade) : '정회원') + '만 볼 수 있습니다. 현재 등급: ' + (r.grade ? String(r.grade) : '확인 불가') + '. 등급 반영이 안 된 것 같으면 입예협에 문의해 주세요.',
            [{ label: '정회원 안내 보기', href: 'delegate-member-guide.html' }, exit]);
        }
        else { showNote('fa-triangle-exclamation', '불러오지 못했습니다. 잠시 후 다시 시도해 주세요.', [retry, exit]); }
      })
      .catch(function () {
        if (seq !== walkSeq || !session) return;
        showNote('fa-triangle-exclamation', '서버에 연결하지 못했습니다. 네트워크를 확인한 뒤 다시 시도해 주세요.',
          [{ label: '다시 시도', fn: loadWalk }, { label: '나가기', ghost: true, fn: function () { backToAuth(''); } }]);
      });
  }

  function backToAuth(note) {
    walkSeq++;
    if (timer) { clearInterval(timer); timer = null; }
    session = null;
    if (document.fullscreenElement && document.exitFullscreen) { try { document.exitFullscreen(); } catch (e) { /* 무시 */ } }
    $('walkFrame').srcdoc = '';
    $('stageNote').hidden = true; $('stageNote').textContent = '';
    $('viewerLeft').textContent = ''; $('viewerWho').textContent = '';
    $('viewer').hidden = true; document.body.style.overflow = '';
    $('authView').hidden = false;
    showMsg(note || '', note ? 'info' : '');
  }

  function toggleFullscreen() {
    var el = $('viewer');
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (el.requestFullscreen) { el.requestFullscreen().catch(function () { /* 거부되면 그대로 둔다 */ }); }
  }
})();
</script>
</body>
</html>
