<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noai, noimageai">
  <title>3D 워크스루 — e편한세상 분당 퍼스트빌리지</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #e8622e; --orange-dark: #c44e1e; --orange-light: #f0864e;
      --navy: #1a3a5c; --navy-light: #2a5a8c; --navy-dark: #0d1b2a;
      --beige: #fdf8f5; --beige-dark: #f5efe8; --beige-warm: #f0e6d8;
      --dark: #2c1810; --gray: #6b5b52; --white: #ffffff;
      --green: #4caf7d; --green-dark: #2f8a5c; --red: #c0392b; --gold: #b8860b;
      --shadow: 0 4px 20px rgba(26,58,92,0.1); --shadow-lg: 0 8px 28px rgba(26,58,92,0.18);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: var(--beige); color: var(--dark); }
    .btn { padding: 11px 20px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.92rem; font-family: inherit;
      color: var(--white); background: linear-gradient(135deg, var(--orange), var(--orange-light)); cursor: pointer; white-space: nowrap; transition: all .2s; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }

    /* ---- 뷰어 ---- */
    .viewer { position: fixed; inset: 0; background: #1b1b1b; z-index: 100; display: flex; flex-direction: column; }
    .viewer .bar { background: var(--navy-dark); color: var(--white); padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .viewer .bar .who { flex: 1; min-width: 0; font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .viewer .bar button { background: rgba(255,255,255,.12); color: var(--white); border: none; border-radius: 8px; padding: 8px 11px; cursor: pointer; font-family: inherit; font-size: 0.85rem; white-space: nowrap; }
    .viewer .bar button:hover { background: rgba(255,255,255,.22); }
    .viewer .bar a.back { color: var(--white); text-decoration: none; font-size: 0.85rem; white-space: nowrap; padding: 8px 4px; }
    .stage { position: relative; flex: 1; min-height: 0; background: #000; }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
    .stage-note { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; color: #fff; background: rgba(13,27,42,.92); font-size: 0.95rem; line-height: 1.6; }
    .stage-note .ic { font-size: 1.8rem; opacity: .85; }
    .spinner { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.25); border-top-color: var(--orange-light); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .viewer .bar { gap: 6px; padding: 6px 8px; }
      .viewer .bar .who { font-size: 0.78rem; }
      .viewer .bar button { padding: 7px 8px; font-size: 0.78rem; }
      .viewer .bar button .lbl { display: none; }
    }
    @media print { body > * { display: none !important; } body::after { content: '이 자료는 인쇄할 수 없습니다.'; display: block; padding: 40px; font-size: 18px; } }
  </style>
  <meta name="tdm-reservation" content="1">
</head>
<body>

<div class="viewer" id="viewer">
  <div class="bar">
    <a class="back" href="index.html"><i class="fas fa-arrow-left"></i> <span class="lbl">메인 페이지</span></a>
    <div class="who">3D 워크스루</div>
    <a class="back" href="https://joy-papa.github.io/ebundangfirst/3d/" target="_blank" rel="noopener" title="새 창에서 열기"><i class="fas fa-up-right-from-square"></i> <span class="lbl">새 창</span></a>
    <button type="button" id="fsBtn" title="전체 화면"><i class="fas fa-expand"></i> <span class="lbl">전체 화면</span></button>
  </div>
  <div class="stage" id="stage">
    <!-- 2026-11-24: 본문은 제작자의 공개 페이지를 그대로 띄운다(분퍼빌놀이터와 같은 방식). 제작자가 고치면 바로 반영된다.
         allow-top-navigation 을 주지 않아 안쪽 페이지가 이 창의 주소를 바꾸지는 못한다. 안쪽이 브라우저 보관(localStorage)을 쓰므로
         allow-same-origin 은 필요하다(출처가 달라 우리 페이지에는 닿지 못함). 예전 방식(웹앱 docWalkOpen 이 실어 둔 본문)은 서버에 그대로 남아 있다. -->
    <iframe id="walkFrame" title="3D 워크스루" src="https://joy-papa.github.io/ebundangfirst/3d/"
      sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-modals"
      allow="fullscreen" referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }

  function toggleFullscreen() {
    var el = $('viewer');
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (el.requestFullscreen) { el.requestFullscreen().catch(function () { /* 거부되면 그대로 둔다 */ }); }
  }

  $('fsBtn').addEventListener('click', toggleFullscreen);
  document.body.style.overflow = 'hidden';
})();
</script>
</body>
</html>
