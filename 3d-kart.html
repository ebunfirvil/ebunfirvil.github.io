  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="e편한세상 분당 퍼스트빌리지 입주예정자협의회 카트 게임 퍼스트빌리지 그랑프리">
  <title>퍼스트빌리지 그랑프리 — e편한세상 분당 퍼스트빌리지</title>
  <!-- 본문 iframe 이 받을 three.js 를 웹앱 응답을 기다리는 동안 미리 받는다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" crossorigin href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #e8622e; --orange-dark: #c44e1e; --orange-light: #f0864e;
      --navy: #1a3a5c; --navy-dark: #0d1b2a; --beige: #fdf8f5; --white: #ffffff;
      --shadow-lg: 0 8px 28px rgba(26,58,92,0.18);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--navy-dark); color: var(--white); }
    .btn { padding: 11px 20px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.92rem; font-family: inherit;
      color: var(--white); background: linear-gradient(135deg, var(--orange), var(--orange-light)); cursor: pointer; white-space: nowrap; }
    .btn:hover { box-shadow: var(--shadow-lg); }

    /* ---- 뷰어: 막대 없이 화면 전체가 격리 iframe(본문에 자체 머리띠가 있다) ---- */
    .viewer { position: fixed; left: 0; right: 0; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    .stage { position: relative; flex: 1; min-height: 0; background: var(--navy-dark); }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--navy-dark); }
    .stage-note { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      padding: 24px; text-align: center; color: #fff; background: rgba(13,27,42,.94); font-size: 0.95rem; line-height: 1.6; word-break: keep-all; }
    .stage-note .ic { font-size: 1.8rem; opacity: .85; }
    .spinner { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.25); border-top-color: var(--orange-light); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ---- 표지(2026-11-18): 들어오면 3초 동안 보이고 옅어지며 넘어간다. 3D 워크스루 표지와 같은 꼴, 바탕은 흰색 ---- */
    .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: #fff; color: #051C2C;
      text-align: center; transition: opacity .8s ease; }
    .splash.out { opacity: 0; pointer-events: none; }
    .splash-bar { display: block; width: 44px; height: 5px; margin: 0 auto; border-radius: 3px; background: #FF671D; }
    .splash-title { margin: 22px 0 0; font-weight: 800; line-height: 1.28; }
    .splash-title span { display: block; font-size: clamp(21px, 5.6vw, 34px); letter-spacing: -0.03em; }
    .splash-title strong { display: block; margin-top: 2px; font-size: clamp(28px, 8vw, 54px); font-weight: 800; letter-spacing: -0.04em; }
    .splash-org { margin: clamp(36px, 7vh, 64px) 0 0; font-size: clamp(15px, 3.8vw, 18px); font-weight: 700; letter-spacing: 0.04em; color: #556474; }
    @media (prefers-reduced-motion: reduce) { .splash { transition: none; } }
    /* ---- 랭킹(2026-11-22): 완주하면 기록을 올릴지 묻고, 회원 카톡 닉네임(동/타입/닉네임)으로 올린다. 상위 10개 ---- */
    .rank { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: rgba(13,27,42,.72); }
    .rank-card { width: min(420px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 20px 18px; border-radius: 14px;
      background: var(--white); color: var(--navy-dark); box-shadow: var(--shadow-lg); font-size: 0.92rem; line-height: 1.55; word-break: keep-all; }
    .rank-card h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .rank-time { font-size: 1.6rem; font-weight: 800; color: var(--orange-dark); font-variant-numeric: tabular-nums; }
    .rank-help { margin: 8px 0; color: #4a5866; font-size: 0.85rem; }
    .rank-help b { color: var(--navy); }
    .rank-input { width: 100%; padding: 10px 12px; border: 1.5px solid #c8d0d8; border-radius: 8px; font: inherit; font-size: 1rem; color: var(--navy-dark); }
    .rank-input:focus { outline: none; border-color: var(--orange); }
    .rank-msg { min-height: 1.4em; margin: 6px 0 0; font-size: 0.85rem; color: #c0392b; }
    .rank-msg.ok { color: #1e7d4f; }
    .rank-btns { display: flex; gap: 8px; margin-top: 10px; }
    .rank-btns .btn { flex: 1 1 auto; }
    .btn.ghost { background: #eef1f4; color: var(--navy); }
    .btn[disabled] { opacity: .55; cursor: wait; }
    .rank-list { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid #e3e7eb; }
    .rank-list li { display: flex; gap: 10px; align-items: baseline; padding: 6px 2px; border-bottom: 1px solid #eef1f4; }
    .rank-list .no { width: 1.8em; flex: none; font-weight: 800; color: var(--orange-dark); text-align: right; }
    .rank-list .nk { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .rank-list .tm { flex: none; font-variant-numeric: tabular-nums; font-weight: 700; }
    .rank-list li.me { background: #fff3ec; }
    .rank-empty { padding: 10px 2px; color: #6b7785; }
        @media print { body > * { display: none !important; } body::after { content: '이 자료는 인쇄할 수 없습니다.'; display: block; padding: 40px; font-size: 18px; color: #000; } }

  <meta name="tdm-reservation" content="1">

<body>

<div class="splash" id="splash">
  <div>
    <span class="splash-bar" aria-hidden="true"></span>
    <p class="splash-title"><span>e편한세상 분당 퍼스트빌리지</span><strong>퍼스트빌리지 그랑프리</strong></p>
    <p class="splash-org">입주예정자협의회</p>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="stage" id="stage">
    <iframe id="kartFrame" title="퍼스트빌리지 그랑프리" sandbox="allow-scripts allow-pointer-lock"></iframe>
    <div class="stage-note" id="stageNote" hidden></div>
  </div>
</div>

<div class="rank" id="rankBox" role="dialog" aria-modal="true" aria-labelledby="rankTitle" hidden>
  <div class="rank-card">
    <div id="rankAsk">
      <h2 id="rankTitle">기록을 랭킹에 올릴까요?</h2>
      <div class="rank-time" id="rankTime">0:00.00</div>
      <p class="rank-help">입예협 단톡방에 등록된 카톡 닉네임 그대로 <b>동/타입/닉네임</b> 으로 적어 주세요.<br>예) <b>101동/55A/홍길동</b><br>인증된 회원 세대의 닉네임만 올라가고, 닉네임마다 가장 빠른 기록 하나만 남습니다.</p>
      <input class="rank-input" id="rankNick" type="text" maxlength="60" autocomplete="off" spellcheck="false" placeholder="101동/55A/닉네임" aria-label="동/타입/닉네임">
      <p class="rank-msg" id="rankMsg" aria-live="polite"></p>
      <div class="rank-btns">
        <button type="button" class="btn" id="rankSend">올리기</button>
        <button type="button" class="btn ghost" id="rankSkip">올리지 않기</button>
      </div>
    </div>
    <div id="rankView" hidden>
      <h2>랭킹 상위 10</h2>
      <p class="rank-msg ok" id="rankDone"></p>
      <ol class="rank-list" id="rankList"></ol>
      <div class="rank-btns">
        <button type="button" class="btn" id="rankClose">닫기</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  // 3d-flyover.html 과 같은 Apps Script 배포. 본문은 docKartOpen(인증 없음)으로 받아 격리 iframe(srcdoc)에만 띄운다.
  var API_URL = 'https://script.google.com/macros/s/AKfycbxBJLSgegfKeO5DvLFMSJ01IBy1Kt4ayFZZ4uu_4bNUyrcbXS5RnbcrKJsm7EPc2pCSNw/exec';
  // 본문(iframe)이 알려 오는 이동 요청 중 허용하는 것만(메시지 안의 주소로는 이동하지 않는다)
  var NAV_ALLOWED = { home: 'index.html', flyover: '3d-flyover.html' };
  function $(id) { return document.getElementById(id); }
  var seqNo = 0; // 늦게 도착한 응답을 버리기 위한 요청 번호

  function api(payload) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (res) { return res.json(); });
  }

  // 표지: 처음 그려진 때부터 3초는 보이고, 본문이 준비되면 옅어지며 걷힌다. 오류면 바로 걷어 안내가 보이게 한다.
  var SPLASH_MS = 3000, SPLASH_CACHED_MS = 1200, splashT0 = 0, splashGone = false;
  function splashOut(now) {
    if (splashGone) return; splashGone = true;
    var el = $('splash');
    if (now === true) { el.hidden = true; return; }
    el.classList.add('out'); setTimeout(function () { el.hidden = true; }, 900);
  }
  function splashReady() {
    if (!splashT0) { requestAnimationFrame(splashReady); return; }
    setTimeout(splashOut, Math.max(0, SPLASH_MS - (performance.now() - splashT0)));
  }
  requestAnimationFrame(function () { splashT0 = performance.now(); setTimeout(splashOut, 12000); }); // 끝내 준비가 안 돼도 표지는 걷는다

  function showNote(icon, text, retry) {
    var note = $('stageNote');
    note.textContent = '';
    var ic = document.createElement('div'); ic.className = 'ic';
    if (icon === 'spin') { var sp = document.createElement('div'); sp.className = 'spinner'; ic.appendChild(sp); }
    else { var i = document.createElement('i'); i.className = 'fas ' + icon; ic.appendChild(i); }
    note.appendChild(ic);
    var p = document.createElement('div'); p.textContent = text; note.appendChild(p);
    if (retry) {
      var el = document.createElement('button'); el.type = 'button'; el.className = 'btn'; el.id = 'retryBtn'; el.textContent = '다시 시도';
      el.addEventListener('click', loadKart);
      note.appendChild(el);
    }
    var home = document.createElement('a'); home.href = 'index.html'; home.className = 'btn'; home.style.textDecoration = 'none'; home.textContent = '홈페이지로'; note.appendChild(home);
    note.hidden = false;
  }

  // ---- 본문 캐시(localStorage): 두 번째 방문부터 웹앱 응답을 기다리지 않고 바로 띄운다 ----
  var CACHE_KEY = 'fvKartBody.v1';
  function validBody(h) { return typeof h === 'string' && h.length > 1000 && h.slice(0, 14).toLowerCase() === '<!doctype html'; }
  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY); if (!raw) return null;
      var c = JSON.parse(raw);
      if (c && typeof c === 'object' && typeof c.updated_at === 'string' && validBody(c.html)) return c;
      localStorage.removeItem(CACHE_KEY);
    } catch (e) { try { localStorage.removeItem(CACHE_KEY); } catch (e2) {} }
    return null;
  }
  function writeCache(updatedAt, html) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ updated_at: String(updatedAt || ''), html: html })); }
    catch (e) { try { localStorage.removeItem(CACHE_KEY); } catch (e2) {} } // 용량 초과 등: 옛 캐시를 지운다
  }
  function focusFrame() { try { $('kartFrame').focus(); } catch (e) {} }
  function showBody(html) {
    $('kartFrame').addEventListener('load', function () { splashReady(); focusFrame(); }, { once: true }); // 본문 문서가 올라오면 표지를 걷고 포커스를 준다(클릭 없이 방향키)
    $('kartFrame').srcdoc = html;      // 본문은 격리 iframe 의 srcdoc 에만 넣는다(캐시에서 꺼낸 것도 같은 경로)
    $('stageNote').hidden = true;
  }

  // 캐시가 있으면 바로 띄우고, 뒤에서 한 번만 불러 updated_at 이 다르면 캐시만 새것으로 바꾼다(보는 화면은 그대로, 오류도 안 띄움).
  function loadFromCache(c) {
    var seq = ++seqNo;
    SPLASH_MS = SPLASH_CACHED_MS;
    showBody(c.html);
    api({ action: 'docKartOpen' })
      .then(function (r) {
        if (seq !== seqNo) return;
        if (r && r.ok && validBody(r.html) && String(r.updated_at || '') !== c.updated_at) writeCache(r.updated_at, r.html);
      })
      .catch(function () {});
  }

  // 읽기 한 번. 실패하면 자동으로 다시 부르지 않고 '다시 시도' 버튼만 보여 준다.
  function loadKart() {
    var seq = ++seqNo;
    $('kartFrame').srcdoc = '';
    showNote('spin', '카트 게임을 불러오는 중입니다…');
    api({ action: 'docKartOpen' })
      .then(function (r) {
        if (seq !== seqNo) return;
        if (r && r.ok && typeof r.html === 'string') {
          showBody(r.html);
          if (validBody(r.html)) writeCache(r.updated_at, r.html);
        } else if (r && (r.error === 'UNKNOWN_ACTION' || r.error === 'NOT_READY')) {
          splashOut(true);
          showNote('fa-hourglass-half', '아직 준비 중입니다. 준비가 끝나면 이 페이지에서 볼 수 있습니다.');
        } else {
          splashOut(true);
          showNote('fa-triangle-exclamation', '불러오지 못했습니다. 잠시 후 다시 시도해 주세요.', true);
        }
      })
      .catch(function () {
        if (seq !== seqNo) return;
        splashOut(true);
        showNote('fa-triangle-exclamation', '서버에 연결하지 못했습니다. 네트워크를 확인한 뒤 다시 시도해 주세요.', true);
      });
  }

  // ---- 최고 기록: 본문(출처 null)은 localStorage 를 못 쓰므로 껍데기가 대신 저장한다 ----
  var BEST_KEY_RE = /^fvgp\.best\.v\d{1,3}$/;
  function readBest(key) {
    try { var v = parseInt(localStorage.getItem(key), 10); return (isFinite(v) && v >= 1 && v <= 3600000) ? v : null; } catch (e) { return null; }
  }
  window.addEventListener('message', function (e) {
    var frame = $('kartFrame');
    if (!frame || e.source !== frame.contentWindow) return;            // 우리 iframe 이 보낸 것만
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'fvNav' && typeof d.to === 'string') {
      if (!Object.prototype.hasOwnProperty.call(NAV_ALLOWED, d.to)) return; // 허용 목록 밖은 무시(메시지 안의 주소로는 이동하지 않는다)
      window.location.href = NAV_ALLOWED[d.to];
    } else if (d.type === 'fvKartBest') {
      if (typeof d.key !== 'string' || !BEST_KEY_RE.test(d.key)) return;
      if (typeof d.ms !== 'number' || d.ms % 1 !== 0 || d.ms < 1 || d.ms > 3600000) return;
      var old = readBest(d.key);
      if (old !== null && old <= d.ms) return;                          // 이미 있는 값보다 작을 때만 덮어쓴다
      try { localStorage.setItem(d.key, String(d.ms)); } catch (e2) {}
    } else if (d.type === 'fvKartBestGet') {
      if (typeof d.key !== 'string' || !BEST_KEY_RE.test(d.key)) return;
      try { frame.contentWindow.postMessage({ type: 'fvKartBest', key: d.key, ms: readBest(d.key) }, '*'); } catch (e3) {}
    } else if (d.type === 'fvKartFinish') {
      if (typeof d.ms !== 'number' || d.ms % 1 !== 0 || d.ms < RANK_MS_MIN || d.ms > RANK_MS_MAX) return;
      if (rankOpen()) return;                                            // 떠 있는 창은 그대로
      rankAsk(d.ms);
    }
  });

  // ---- 랭킹(2026-11-22): 회원 인증 01 웹앱(새 구글 시트 `카트랭킹` 탭)에 올린다 ----
  var RANK_URL = 'https://script.google.com/macros/s/AKfycby9vTNrinqu8z9Iuozw_029oIgZ3j2JnIjP5LWlznf6dtu3lPm9HS-KM_V_DdyvBJpU/exec';
  var RANK_NICK_KEY = 'fvKartRankNick.v1'; // 마지막에 쓴 닉네임(다음 완주 때 미리 채움)
  var RANK_MS_MIN = 60000, RANK_MS_MAX = 3600000;
  var RANK_ERR = {
    BAD_NICK: '동/타입/닉네임 꼴로 적어 주세요. 예) 101동/55A/홍길동',
    NOT_MEMBER: '인증된 회원 세대에서 그 닉네임을 찾지 못했습니다. 단톡방 닉네임과 동·타입을 그대로 적어 주세요.',
    BAD_TIME: '올릴 수 없는 기록입니다.',
    LIMIT: '잠시 뒤 다시 올려 주세요.',
    BUSY: '잠시 뒤 다시 올려 주세요.',
    NOT_READY: '랭킹 준비 중입니다. 나중에 다시 올려 주세요.'
  };
  var rankMs = 0, rankBusy = false, rankSeq = 0;
  function rankOpen() { return !$('rankBox').hidden; }
  function rankApi(payload) {
    return fetch(RANK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), credentials: 'omit', redirect: 'follow' })
      .then(function (res) { return res.json(); });
  }
  function fmtMs(ms) {
    var t = Math.max(0, Math.round(ms));
    var m = Math.floor(t / 60000), s = Math.floor((t % 60000) / 1000), c = Math.floor((t % 1000) / 10);
    return m + ':' + (s < 10 ? '0' : '') + s + '.' + (c < 10 ? '0' : '') + c;
  }
  function rankMsg(text, ok) { var el = $('rankMsg'); el.textContent = text || ''; el.className = 'rank-msg' + (ok ? ' ok' : ''); }
  // 서버가 준 닉네임도 글자로만 넣는다(textContent)
  function rankRender(top, mine) {
    var ol = $('rankList');
    ol.textContent = '';
    if (!Array.isArray(top) || !top.length) {
      var e = document.createElement('li'); e.className = 'rank-empty'; e.textContent = '아직 올라온 기록이 없습니다.'; ol.appendChild(e); return;
    }
    for (var i = 0; i < top.length && i < 10; i++) {
      var it = top[i] || {};
      if (typeof it.nick !== 'string' || typeof it.ms !== 'number') continue;
      var li = document.createElement('li');
      if (mine && it.nick === mine) li.className = 'me';
      var a = document.createElement('span'); a.className = 'no'; a.textContent = String(i + 1);
      var b = document.createElement('span'); b.className = 'nk'; b.textContent = it.nick;
      var c = document.createElement('span'); c.className = 'tm'; c.textContent = fmtMs(it.ms);
      li.appendChild(a); li.appendChild(b); li.appendChild(c); ol.appendChild(li);
    }
  }
  function rankShowView(done, top, mine) {
    $('rankAsk').hidden = true; $('rankView').hidden = false;
    $('rankDone').textContent = done || '';
    rankRender(top, mine);
    try { $('rankClose').focus(); } catch (e) {}
  }
  function rankAsk(ms) {
    rankMs = ms; rankBusy = false; rankSeq++;
    $('rankTime').textContent = fmtMs(ms);
    $('rankAsk').hidden = false; $('rankView').hidden = true;
    rankMsg('');
    $('rankSend').disabled = false; $('rankSkip').disabled = false;
    var last = ''; try { last = localStorage.getItem(RANK_NICK_KEY) || ''; } catch (e) {}
    $('rankNick').value = last.slice(0, 60);
    $('rankBox').hidden = false;
    try { $('rankNick').focus(); } catch (e2) {}
  }
  function rankSend() {
    if (rankBusy) return;
    var nick = $('rankNick').value.replace(/\s+/g, ' ').trim();
    if (!/^\d{3}\s*동?\s*\/\s*\d{2}\s*[A-Za-z]\s*\/\s*\S/.test(nick)) { rankMsg(RANK_ERR.BAD_NICK); return; }
    rankBusy = true; var my = ++rankSeq;
    $('rankSend').disabled = true; $('rankSkip').disabled = true;
    rankMsg('올리는 중…', true);
    rankApi({ op: 'kart_submit', nick: nick, ms: rankMs })
      .then(function (r) {
        if (my !== rankSeq) return;
        rankBusy = false; $('rankSend').disabled = false; $('rankSkip').disabled = false;
        if (!r || !r.ok) { rankMsg(RANK_ERR[r && r.error] || '올리지 못했습니다. 잠시 뒤 다시 시도해 주세요.'); return; }
        try { localStorage.setItem(RANK_NICK_KEY, nick); } catch (e) {}
        var mine = r.item && typeof r.item.nick === 'string' ? r.item.nick : '';
        var done = (r.changed ? '올렸습니다.' : '이 닉네임의 더 빠른 기록(' + fmtMs(r.best) + ')이 이미 있어 그대로 둡니다.')
          + (typeof r.rank === 'number' ? ' 지금 ' + r.rank + '위입니다.' : '');
        rankShowView(done, r.top, mine);
      })
      .catch(function () {
        if (my !== rankSeq) return;
        rankBusy = false; $('rankSend').disabled = false; $('rankSkip').disabled = false;
        rankMsg('연결이 원활하지 않습니다. 잠시 뒤 다시 시도해 주세요.');
      });
  }
  // 올리지 않아도 상위 10은 보여 준다
  function rankSkip() {
    var my = ++rankSeq; rankBusy = false;
    rankShowView('', [], '');
    $('rankDone').textContent = '랭킹을 불러오는 중…';
    rankApi({ op: 'kart_top' })
      .then(function (r) {
        if (my !== rankSeq) return;
        if (!r || !r.ok) { $('rankDone').textContent = '랭킹을 불러오지 못했습니다.'; return; }
        $('rankDone').textContent = ''; rankRender(r.top, '');
      })
      .catch(function () { if (my === rankSeq) $('rankDone').textContent = '랭킹을 불러오지 못했습니다.'; });
  }
  function rankClose() { rankSeq++; rankBusy = false; $('rankBox').hidden = true; focusFrame(); }
  $('rankSend').addEventListener('click', rankSend);
  $('rankSkip').addEventListener('click', rankSkip);
  $('rankClose').addEventListener('click', rankClose);
  $('rankNick').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); rankSend(); } });
  $('rankBox').addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); rankClose(); } });

  // 화면을 눌러도 포커스는 iframe 으로(본문 밖 빈 곳을 눌러 포커스를 잃어도 방향키가 계속 먹게). 랭킹 창이 떠 있을 때는 빼고
  window.addEventListener('pointerdown', function () { if (!rankOpen()) focusFrame(); });
  window.addEventListener('focus', function () { if (!rankOpen()) focusFrame(); });

  var cached = readCache();
  if (cached) loadFromCache(cached); else loadKart();
})();
</script>
</body>
</html>
