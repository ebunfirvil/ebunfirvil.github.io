<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noai, noimageai">
  <meta name="description" content="e편한세상 분당 퍼스트빌리지 입주예정자협의회 카트 게임 퍼스트빌리지 그랑프리">
  <title>퍼스트빌리지 그랑프리 — e편한세상 분당 퍼스트빌리지</title>
  <!-- 본문 iframe 이 받을 three.js 를 웹앱 응답을 기다리는 동안 미리 받는다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" crossorigin href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #e8622e; --orange-dark: #c44e1e; --orange-light: #f0864e;
      --navy: #1a3a5c; --navy-dark: #0d1b2a; --beige: #fdf8f5; --white: #ffffff;
      --shadow-lg: 0 8px 28px rgba(26,58,92,0.18);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--navy-dark); color: var(--white); }
    .btn { padding: 11px 20px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.92rem; font-family: inherit;
      color: var(--white); background: linear-gradient(135deg, var(--orange), var(--orange-light)); cursor: pointer; white-space: nowrap; }
    .btn:hover { box-shadow: var(--shadow-lg); }

    /* ---- 뷰어: 막대 없이 화면 전체가 격리 iframe(본문에 자체 머리띠가 있다) ---- */
    .viewer { position: fixed; left: 0; right: 0; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    .stage { position: relative; flex: 1; min-height: 0; background: var(--navy-dark); }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--navy-dark); }
    .stage-note { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      padding: 24px; text-align: center; color: #fff; background: rgba(13,27,42,.94); font-size: 0.95rem; line-height: 1.6; word-break: keep-all; }
    .stage-note .ic { font-size: 1.8rem; opacity: .85; }
    .spinner { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.25); border-top-color: var(--orange-light); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ---- 표지(2026-11-18): 들어오면 3초 동안 보이고 옅어지며 넘어간다. 3D 워크스루 표지와 같은 꼴, 바탕은 흰색 ---- */
    .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: #fff; color: #051C2C;
      text-align: center; transition: opacity .8s ease; }
    .splash.out { opacity: 0; pointer-events: none; }
    .splash-bar { display: block; width: 44px; height: 5px; margin: 0 auto; border-radius: 3px; background: #FF671D; }
    .splash-title { margin: 22px 0 0; font-weight: 800; line-height: 1.28; }
    .splash-title span { display: block; font-size: clamp(21px, 5.6vw, 34px); letter-spacing: -0.03em; }
    .splash-title strong { display: block; margin-top: 2px; font-size: clamp(28px, 8vw, 54px); font-weight: 800; letter-spacing: -0.04em; }
    .splash-org { margin: clamp(36px, 7vh, 64px) 0 0; font-size: clamp(15px, 3.8vw, 18px); font-weight: 700; letter-spacing: 0.04em; color: #556474; }
    @media (prefers-reduced-motion: reduce) { .splash { transition: none; } }
        @media print { body > * { display: none !important; } body::after { content: '이 자료는 인쇄할 수 없습니다.'; display: block; padding: 40px; font-size: 18px; color: #000; } }
  </style>
  <meta name="tdm-reservation" content="1">
</head>
<body>

<div class="splash" id="splash">
  <div>
    <span class="splash-bar" aria-hidden="true"></span>
    <p class="splash-title"><span>e편한세상 분당 퍼스트빌리지</span><strong>퍼스트빌리지 그랑프리</strong></p>
    <p class="splash-org">입주예정자협의회</p>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="stage" id="stage">
    <iframe id="kartFrame" title="퍼스트빌리지 그랑프리" sandbox="allow-scripts allow-pointer-lock"></iframe>
    <div class="stage-note" id="stageNote" hidden></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  // 3d-flyover.html 과 같은 Apps Script 배포. 본문은 docKartOpen(인증 없음)으로 받아 격리 iframe(srcdoc)에만 띄운다.
  var API_URL = 'https://script.google.com/macros/s/AKfycbxBJLSgegfKeO5DvLFMSJ01IBy1Kt4ayFZZ4uu_4bNUyrcbXS5RnbcrKJsm7EPc2pCSNw/exec';
  // 본문(iframe)이 알려 오는 이동 요청 중 허용하는 것만(메시지 안의 주소로는 이동하지 않는다)
  var NAV_ALLOWED = { home: 'index.html', flyover: '3d-flyover.html' };
  function $(id) { return document.getElementById(id); }
  var seqNo = 0; // 늦게 도착한 응답을 버리기 위한 요청 번호

  function api(payload) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (res) { return res.json(); });
  }

  // 표지: 처음 그려진 때부터 3초는 보이고, 본문이 준비되면 옅어지며 걷힌다. 오류면 바로 걷어 안내가 보이게 한다.
  var SPLASH_MS = 3000, SPLASH_CACHED_MS = 1200, splashT0 = 0, splashGone = false;
  function splashOut(now) {
    if (splashGone) return; splashGone = true;
    var el = $('splash');
    if (now === true) { el.hidden = true; return; }
    el.classList.add('out'); setTimeout(function () { el.hidden = true; }, 900);
  }
  function splashReady() {
    if (!splashT0) { requestAnimationFrame(splashReady); return; }
    setTimeout(splashOut, Math.max(0, SPLASH_MS - (performance.now() - splashT0)));
  }
  requestAnimationFrame(function () { splashT0 = performance.now(); setTimeout(splashOut, 12000); }); // 끝내 준비가 안 돼도 표지는 걷는다

  function showNote(icon, text, retry) {
    var note = $('stageNote');
    note.textContent = '';
    var ic = document.createElement('div'); ic.className = 'ic';
    if (icon === 'spin') { var sp = document.createElement('div'); sp.className = 'spinner'; ic.appendChild(sp); }
    else { var i = document.createElement('i'); i.className = 'fas ' + icon; ic.appendChild(i); }
    note.appendChild(ic);
    var p = document.createElement('div'); p.textContent = text; note.appendChild(p);
    if (retry) {
      var el = document.createElement('button'); el.type = 'button'; el.className = 'btn'; el.id = 'retryBtn'; el.textContent = '다시 시도';
      el.addEventListener('click', loadKart);
      note.appendChild(el);
    }
    var home = document.createElement('a'); home.href = 'index.html'; home.className = 'btn'; home.style.textDecoration = 'none'; home.textContent = '홈페이지로'; note.appendChild(home);
    note.hidden = false;
  }

  // ---- 본문 캐시(localStorage): 두 번째 방문부터 웹앱 응답을 기다리지 않고 바로 띄운다 ----
  var CACHE_KEY = 'fvKartBody.v1';
  function validBody(h) { return typeof h === 'string' && h.length > 1000 && h.slice(0, 14).toLowerCase() === '<!doctype html'; }
  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY); if (!raw) return null;
      var c = JSON.parse(raw);
      if (c && typeof c === 'object' && typeof c.updated_at === 'string' && validBody(c.html)) return c;
      localStorage.removeItem(CACHE_KEY);
    } catch (e) { try { localStorage.removeItem(CACHE_KEY); } catch (e2) {} }
    return null;
  }
  function writeCache(updatedAt, html) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ updated_at: String(updatedAt || ''), html: html })); }
    catch (e) { try { localStorage.removeItem(CACHE_KEY); } catch (e2) {} } // 용량 초과 등: 옛 캐시를 지운다
  }
  function focusFrame() { try { $('kartFrame').focus(); } catch (e) {} }
  function showBody(html) {
    $('kartFrame').addEventListener('load', function () { splashReady(); focusFrame(); }, { once: true }); // 본문 문서가 올라오면 표지를 걷고 포커스를 준다(클릭 없이 방향키)
    $('kartFrame').srcdoc = html;      // 본문은 격리 iframe 의 srcdoc 에만 넣는다(캐시에서 꺼낸 것도 같은 경로)
    $('stageNote').hidden = true;
  }

  // 캐시가 있으면 바로 띄우고, 뒤에서 한 번만 불러 updated_at 이 다르면 캐시만 새것으로 바꾼다(보는 화면은 그대로, 오류도 안 띄움).
  function loadFromCache(c) {
    var seq = ++seqNo;
    SPLASH_MS = SPLASH_CACHED_MS;
    showBody(c.html);
    api({ action: 'docKartOpen' })
      .then(function (r) {
        if (seq !== seqNo) return;
        if (r && r.ok && validBody(r.html) && String(r.updated_at || '') !== c.updated_at) writeCache(r.updated_at, r.html);
      })
      .catch(function () {});
  }

  // 읽기 한 번. 실패하면 자동으로 다시 부르지 않고 '다시 시도' 버튼만 보여 준다.
  function loadKart() {
    var seq = ++seqNo;
    $('kartFrame').srcdoc = '';
    showNote('spin', '카트 게임을 불러오는 중입니다…');
    api({ action: 'docKartOpen' })
      .then(function (r) {
        if (seq !== seqNo) return;
        if (r && r.ok && typeof r.html === 'string') {
          showBody(r.html);
          if (validBody(r.html)) writeCache(r.updated_at, r.html);
        } else if (r && (r.error === 'UNKNOWN_ACTION' || r.error === 'NOT_READY')) {
          splashOut(true);
          showNote('fa-hourglass-half', '아직 준비 중입니다. 준비가 끝나면 이 페이지에서 볼 수 있습니다.');
        } else {
          splashOut(true);
          showNote('fa-triangle-exclamation', '불러오지 못했습니다. 잠시 후 다시 시도해 주세요.', true);
        }
      })
      .catch(function () {
        if (seq !== seqNo) return;
        splashOut(true);
        showNote('fa-triangle-exclamation', '서버에 연결하지 못했습니다. 네트워크를 확인한 뒤 다시 시도해 주세요.', true);
      });
  }

  // ---- 최고 기록: 본문(출처 null)은 localStorage 를 못 쓰므로 껍데기가 대신 저장한다 ----
  var BEST_KEY_RE = /^fvgp\.best\.v\d{1,3}$/;
  function readBest(key) {
    try { var v = parseInt(localStorage.getItem(key), 10); return (isFinite(v) && v >= 1 && v <= 3600000) ? v : null; } catch (e) { return null; }
  }
  window.addEventListener('message', function (e) {
    var frame = $('kartFrame');
    if (!frame || e.source !== frame.contentWindow) return;            // 우리 iframe 이 보낸 것만
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'fvNav' && typeof d.to === 'string') {
      if (!Object.prototype.hasOwnProperty.call(NAV_ALLOWED, d.to)) return; // 허용 목록 밖은 무시(메시지 안의 주소로는 이동하지 않는다)
      window.location.href = NAV_ALLOWED[d.to];
    } else if (d.type === 'fvKartBest') {
      if (typeof d.key !== 'string' || !BEST_KEY_RE.test(d.key)) return;
      if (typeof d.ms !== 'number' || d.ms % 1 !== 0 || d.ms < 1 || d.ms > 3600000) return;
      var old = readBest(d.key);
      if (old !== null && old <= d.ms) return;                          // 이미 있는 값보다 작을 때만 덮어쓴다
      try { localStorage.setItem(d.key, String(d.ms)); } catch (e2) {}
    } else if (d.type === 'fvKartBestGet') {
      if (typeof d.key !== 'string' || !BEST_KEY_RE.test(d.key)) return;
      try { frame.contentWindow.postMessage({ type: 'fvKartBest', key: d.key, ms: readBest(d.key) }, '*'); } catch (e3) {}
    }
  });

  // 화면을 눌러도 포커스는 iframe 으로(본문 밖 빈 곳을 눌러 포커스를 잃어도 방향키가 계속 먹게)
  window.addEventListener('pointerdown', focusFrame);
  window.addEventListener('focus', focusFrame);

  var cached = readCache();
  if (cached) loadFromCache(cached); else loadKart();
})();
</script>
</body>
</html>
